name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-unzip any zip files in the repo
        run: |
          shopt -s globstar nullglob
          for z in **/*.zip; do
            echo "Found zip: $z — extracting..."
            unzip -o -q "$z" -d "$(dirname "$z")"
          done

      - name: Locate the Gradle project (find settings.gradle anywhere)
        id: find_project
        run: |
          SETTINGS_FILE=$(find . -maxdepth 6 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle anywhere in the repo."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: gradle assembleDebug

      - name: Locate built APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*-debug.apk" -path "*/outputs/apk/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK found after build."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
